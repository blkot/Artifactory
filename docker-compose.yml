services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: artifactory-backend
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./assets:/app/assets
      - ./data:/app/data
      - ./backups:/app/backups
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: artifactory-frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

